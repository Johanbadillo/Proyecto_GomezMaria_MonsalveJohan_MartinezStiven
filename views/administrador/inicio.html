<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./style/inicio.css">
</head>

<body>

    <header>
        <img class="logo" src="./media/logito.png" alt="logito">
        <nav>
            <a href="./inicio.html">Inicio</a>
            <a href="./curso.html">Cursos</a>
            <a href="./tareas.html">Tareas y Evaluaciones</a>
            <a href="./progreso.html">Progreso Cursos</a>
        </nav>
        <div class="perfil">
            <img class="profile" src="./media/sol.png" alt="modos">
            <p>Stiven Martinez Villamizar</p>
            <img class="profile" src="./media/perfil.png" alt="iconoPerfil">
        </div>
    </header>

    <div class="contenido">
        <article class="estadisticasPrincipales">
            <h1>INICIO</h1>
            <div class="cuadros">
                <div class="card">
                    <h3>Usuarios Registros</h3>
                    <p>35</p>
                    <a href="cursos.html" class="circulo">+</a>
                </div>
                <div class="card">
                    <h3>Cursos Creados</h3>
                    <p>20</p>
                    <a href="usuarios.html" class="circulo">+</a>
                </div>

                <div class="contenedor2">

                    <div class="chart-container">
                        <div class="bar-group">
                            <div class="bar bar-green" id="total-bar" style="height: 25vi;"></div>
                            <div class="bar-label">Total Cursos</div>
                            <div class="bar-count">98 Cursos</div>
                        </div>

                        <div class="bar-group">
                            <div class="bar bar-gray" id="inactive-bar" style="height: 60px;"></div>
                            <div class="bar-label">Cursos Inactivos</div>
                            <div class="bar-count">18 Cursos</div>
                        </div>

                        <div class="bar-group">
                            <div class="bar bar-blue" id="active-bar" style="height: 20vi;"></div>
                            <div class="bar-label">Cursos Activos</div>
                            <div class="bar-count">80 Cursos</div>
                        </div>
                    </div>
                </div>
            </div>
    </div>
