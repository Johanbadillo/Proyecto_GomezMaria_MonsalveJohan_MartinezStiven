<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./styles/Login.css">
</head>
<body>
    
<div class="container1">

    <div class="barra">
        
        <div class="titulo">
   <h1>LMS PORTAL</h1>
   </div>
  </div>

   <div class="container2">
   <div class="titulo2">
    <h2>INGRESAR</h2>
   </div>
   <div class="formularioUsuario">
    <form action="#" method="post">

  <label for="usuario">Usuario:</label>
  <input type="text" id="usuario" name="usuario" placeholder="Ingresa tu usuario">
  </form>
</div>

<div class="formularioContraseña">
<form action="#" method="post">
  <label for="Contraseña">Contraseña:</label>
  <input type="text" id="Contraseña" name="Contraseña" placeholder="****************">
    </form>
</div>

<div class="tipoUsuarios">
<form action="#" method="post">
  <label for="Tipo de Usuario">Tipo de Usuario:</label>
  <select name="Tipo de Usuario" id="Tipo de Usuario" required>
     <option value="Docente">Docente</option>
     <option value="Estudiante">Estudiante</option>
     <option value="Administrador">Administrador</option>
  </select>

</div>
</div>

<div class="boton">
<button>INGRESAR</button>
</div>


</body>
<script src="./scripts/Login.js"></script>
</html>
